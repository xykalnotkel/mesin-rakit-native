name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Versi rilis, contoh v1.0.0"
        required: false
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Tes logika model (JVM)
        run: |
          set -e
          curl -sSL -o /tmp/kc.zip https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          unzip -q /tmp/kc.zip -d /tmp/kotlinc
          chmod +x /tmp/kotlinc/kotlinc/bin/*
          JAR=$(find "$ANDROID_HOME/platforms" -name android.jar | sort | tail -1)
          echo "android.jar: $JAR"
          SRC=$(find app/src/main/java/id/mesinrakit/core app/src/main/java/id/mesinrakit/data app/src/main/java/id/mesinrakit/model -name '*.kt' | grep -v PartShape | tr '\n' ' ')
          /tmp/kotlinc/kotlinc/bin/kotlinc -cp "$JAR" -d /tmp/outtest $SRC test/TestModel.kt
          java -cp /tmp/outtest:/tmp/kotlinc/kotlinc/lib/kotlin-stdlib.jar TestModelKt

      - name: Siapkan kunci tanda tangan
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/mesin-rakit.jks

      - name: Build APK release
        env:
          KEYSTORE_FILE: /tmp/mesin-rakit.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon --stacktrace
          rm -f /tmp/mesin-rakit.jks

      - name: Siapkan nama berkas
        id: ver
        run: |
          V="${GITHUB_REF_NAME}"
          if [ -z "$V" ] || [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            V="${{ github.event.inputs.version }}"
          fi
          if [ -z "$V" ]; then V="v1.0.0"; fi
          echo "versi=$V" >> "$GITHUB_OUTPUT"
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/mesin-rakit-$V.apk"
          ls -lh out

      - name: Simpan artefak
        uses: actions/upload-artifact@v4
        with:
          name: mesin-rakit-apk
          path: out/*.apk

      - name: Terbitkan Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.versi }}
          name: MESIN RAKIT ${{ steps.ver.outputs.versi }}
          body_path: RELEASE_NOTES.md
          files: out/*.apk
          draft: false
          prerelease: false
